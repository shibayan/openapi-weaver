name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/OpenApiWeaver/OpenApiWeaver.csproj
            tests/OpenApiWeaver.Tests/OpenApiWeaver.Tests.csproj
            samples/SampleApp/SampleApp.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore OpenApiWeaver.slnx

      - name: Build
        run: dotnet build OpenApiWeaver.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format OpenApiWeaver.slnx --verify-no-changes --verbosity detailed --no-restore

      - name: Test
        run: dotnet test OpenApiWeaver.slnx --configuration Release --no-build
