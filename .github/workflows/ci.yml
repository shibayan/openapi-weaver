name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/OpenApiWeaver/OpenApiWeaver.csproj
            tests/OpenApiWeaver.Tests/OpenApiWeaver.Tests.csproj
            samples/SampleApp/SampleApp.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore OpenApiWeaver.slnx

      - name: Build
        run: dotnet build OpenApiWeaver.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format OpenApiWeaver.slnx --verify-no-changes --verbosity detailed --no-restore

      - name: Test
        run: dotnet test OpenApiWeaver.slnx --configuration Release --no-build
