name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/OpenApiWeaver/OpenApiWeaver.csproj
            tests/OpenApiWeaver.Tests/OpenApiWeaver.Tests.csproj
            samples/SampleApp/SampleApp.csproj
            Directory.Build.props

      - name: Restore
        run: dotnet restore OpenApiWeaver.slnx

      - name: Build
        run: dotnet build OpenApiWeaver.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenApiWeaver.slnx --configuration Release --no-build
